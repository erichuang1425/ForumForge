name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify and publish artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and tag version
        run: |
          test "$GITHUB_REF_NAME" != "v0.0.0"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          pnpm verify
          node scripts/version.mjs check "$GITHUB_REF_NAME"

      - name: Confirm tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Package extension
        run: node scripts/package-extension.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "ForumForge $GITHUB_REF_NAME"
